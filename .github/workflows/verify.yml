name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generator reproduces the committed patch
        run: |
          cp cordis.patch.yml /tmp/committed.yml
          python3 generate-patch.py
          diff -u /tmp/committed.yml cordis.patch.yml \
            || { echo "::error::generate-patch.py output differs from cordis.patch.yml — run 'npm run build'"; exit 1; }

      - name: Patch parses and declares the expected mode
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          node -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          const doc = yaml.load(fs.readFileSync('cordis.patch.yml','utf8').replace(/!!js/g,''));
          const preset = doc[0].insert.find(r => r.name === '@deepseek-ai/dsh-agent-preset').config;
          if (preset.id !== 'codex-claude') throw new Error('unexpected preset id: ' + preset.id);
          const flat = [];
          (function walk(l){ for (const r of l||[]) { if (r.name === 'cordis:group') { walk(r.config); continue; } flat.push(r); } })(preset.plugins);
          const ids = flat.map(r => r.id);
          if (ids.length !== new Set(ids).size) throw new Error('duplicate row ids');
          const providers = flat.filter(r => /dsh-subagent-(codex|claude-code)$/.test(r.name||''));
          if (providers.length !== 4) throw new Error('expected 4 providers, got ' + providers.length);
          const tools = flat.filter(r => r.config && r.config.toolName).map(r => r.config.toolName);
          const want = ['subagent_codex','subagent_codex_readonly','subagent_claude_code','subagent_claude_readonly'];
          for (const t of want) if (!tools.includes(t)) throw new Error('missing tool ' + t);
          console.log('preset ok:', preset.id, '|', flat.length, 'rows |', providers.length, 'providers');
          "

      - name: plan-mode keeps its required section
        run: |
          node -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          const doc = yaml.load(fs.readFileSync('cordis.patch.yml','utf8').replace(/!!js/g,''));
          const preset = doc[0].insert.find(r => r.name === '@deepseek-ai/dsh-agent-preset').config;
          const planning = preset.plugins.find(r => r.id === 'planning');
          const pm = planning.config.find(r => r.id === 'plan-mode');
          const s = pm.config && pm.config.section;
          if (typeof s !== 'string' || s.trim() === '') {
            throw new Error('plan-mode has no section — PlanModeConfig requires a non-empty section and the WHOLE preset will fail to load');
          }
          console.log('plan-mode section ok:', s.length, 'chars /', s.split('\n\n').length, 'paragraphs');
          "

      - name: Doctor CLI is syntactically valid and self-documenting
        run: |
          node --check bin/doctor.mjs
          node bin/doctor.mjs --help >/dev/null
